<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="studioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#studioGrad)" filter="url(#shadow)" />
  
  <!-- Outer glowing border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8" />

  <!-- Subtitle Screen Graphic Frame -->
  <rect x="80" y="110" width="352" height="250" rx="40" fill="#0f172a" fill-opacity="0.88" stroke="rgba(255,255,255,0.2)" stroke-width="8" />
  
  <!-- CC Text / Icons inside screen -->
  <!-- Left C -->
  <path d="M 215 190 C 205 175 185 165 165 165 C 130 165 105 195 105 235 C 105 275 130 305 165 305 C 185 305 205 295 215 280" 
        fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
  <!-- Right C -->
  <path d="M 335 190 C 325 175 305 165 285 165 C 250 165 225 195 225 235 C 225 275 250 305 285 305 C 305 305 325 295 335 280" 
        fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />

  <!-- Waveform lines below screen -->
  <rect x="100" y="395" width="24" height="42" rx="12" fill="#60a5fa" />
  <rect x="140" y="380" width="24" height="72" rx="12" fill="#93c5fd" />
  <rect x="180" y="365" width="24" height="102" rx="12" fill="#ffffff" />
  <rect x="220" y="390" width="24" height="52" rx="12" fill="#a78bfa" />
  <rect x="260" y="375" width="24" height="82" rx="12" fill="#c4b5fd" />
  <rect x="300" y="365" width="24" height="102" rx="12" fill="#ffffff" />
  <rect x="340" y="385" width="24" height="62" rx="12" fill="#93c5fd" />
  <rect x="380" y="400" width="24" height="32" rx="12" fill="#60a5fa" />

  <!-- AI Magic Star (Top Right) -->
  <path d="M 400 70 Q 400 120 450 120 Q 400 120 400 170 Q 400 120 350 120 Q 400 120 400 70 Z" fill="url(#sparkGrad)" />
</svg>
